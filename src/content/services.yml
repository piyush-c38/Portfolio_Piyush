    projects:
      - title: The Build House
        slug: the-build-house
        description: A modern interior design website for a leading design firm.
        image: https://res.cloudinary.com/yfhun3wh/image/upload/v1785233237/living-room_uvouxf.jpg
        technologies:
          - React
          - Node.js
          - Cloudinary
        completed_date: June 2026
        link: https://piyush-c38.github.io/agency-interior-designer/
        case_study:
          - title: The Build House
            subtitle: A modern interior design website for a leading design firm.
            accentColor: bg-[#f2eee7]
            chapters:
              - label: The Story Behind the Project
                heading: A Unique Vision
                body: Every great project begins with a unique vision. For this client, the core objective was to break away from traditional layouts and present their portfolio through a narrative-driven experience. They wanted their work to unfold like a story, engaging visitors on a deeper, more emotional level.
                image: https://res.cloudinary.com/yfhun3wh/image/upload/v1787295813/Screenshot_from_2026-08-21_12-33-12_mzmzeg.png
              - label: Design Philosophy
                heading: Aesthetic Preferences
                body: |
                  The client’s aesthetic preferences were focused and intentional
                  - Minimalist & Modern: Clean layouts that let the content breathe.
                  - Earthy UI Tones: A warm, organic color palette to create a welcoming and grounded atmosphere.
                  - Smooth Animations: Fluid transitions that enhance storytelling without overwhelming the user.
                image: https://res.cloudinary.com/yfhun3wh/image/upload/v1787295608/1_phvclp.png
              - label: Key Interactive Concept
                heading: Sticky-Notes-On-Wall
                body: To bring the narrative to life, the client envisioned a standout feature. Multiple projects showcased in a "Sticky-Notes-On-Wall" style, giving users an interactive, tactile way to explore their creative journey.
                image: https://res.cloudinary.com/yfhun3wh/image/upload/v1787295608/2_drcjz9.png
              - label: Functional Requirements
                body: |
                  Beyond the aesthetics, the website required a robust, user-friendly feature set
                  - Work Sample Gallery: An immersive portfolio showcase.
                  - Detailed Case Study Section: In-depth breakdowns of past projects.
                  - Contact & Enquiry Section: A seamless way for potential clients to reach out.
                  - Newsletter Form: To build and maintain audience engagement.
                image: https://res.cloudinary.com/yfhun3wh/image/upload/v1787295608/3_riahyz.png
              - label: The Final Outcome
                heading: Happy!!!
                body: Ultimately, the requirement was to deliver a modern, elegant, and fully responsive website that looks and performs exceptionally across all devices—seamlessly blending storytelling with digital craftsmanship.
                image: https://res.cloudinary.com/yfhun3wh/image/upload/v1787295607/4_jhtngl.png
